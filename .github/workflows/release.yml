name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Version.swift
        run: grep -qx "public let version = \"${GITHUB_REF_NAME#v}\"" Sources/MacDNSViewCore/Version.swift

      - run: swift test
      - run: scripts/bundle.sh

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes

      - name: Update the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
          path=repos/ebudist/homebrew-tap/contents/Formula/macdnsview.rb
          gh api "$path" -q .content | base64 -d \
            | sed -E "s#^  url \".*\"#  url \"$url\"#; s#^  sha256 \".*\"#  sha256 \"$sha\"#" > macdnsview.rb
          gh api -X PUT "$path" -f message="chore: macdnsview ${GITHUB_REF_NAME#v}" \
            -f content="$(base64 -i macdnsview.rb)" -f sha="$(gh api "$path" -q .sha)" -q .commit.html_url
