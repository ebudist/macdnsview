name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Version.swift
        run: grep -qx "public let version = \"${GITHUB_REF_NAME#v}\"" Sources/MacDNSViewCore/Version.swift

      - run: swift test
      - run: scripts/bundle.sh

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes

      - name: Update the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          REPO: ebudist/homebrew-tap
          FILE: Formula/macdnsview.rb
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
          gh api "repos/$REPO/contents/$FILE" -q .content | base64 -d \
            | sed -E "s#^  url \".*\"#  url \"$url\"#; s#^  sha256 \".*\"#  sha256 \"$sha\"#" > formula.rb
          # createCommitOnBranch, unlike the contents API, gets the commit signed by GitHub.
          jq -n --arg repo "$REPO" --arg file "$FILE" --arg head "$(gh api "repos/$REPO/commits/main" -q .sha)" \
            --arg msg "chore: macdnsview ${GITHUB_REF_NAME#v}" --arg body "$(base64 -i formula.rb)" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: "main"}, message: {headline: $msg},
                expectedHeadOid: $head, fileChanges: {additions: [{path: $file, contents: $body}]}}}}' \
            | gh api graphql --input - -q .data.createCommitOnBranch.commit.url
